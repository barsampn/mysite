<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>درگاه یکپارچه احراز هویت</title>
<style>
  @font-face {
    font-family: 'Peyda';
    src: url('fonts/Peyda-Medium.ttf') format('truetype');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --navy:#304a79;
    --navy-dark:#253c63;
    --heading:#1a1a1a;
    --label:#3a3c3e;
    --body-gray:#5d5f61;
    --line:#9a9c9e;
    --line-light:#d6d7d8;
    --btn-idle-bg:#e9eaea;
    --btn-idle-text:#c3c4c5;
    --placeholder:#b7b9bb;
    --error:#c0392b;
    --strip-w:32px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:'Peyda', Tahoma, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 38%, #f8f8f8 0%, #dcdcdc 55%, #b3b3b3 100%);
    padding:32px var(--strip-w) 32px 32px;
    position:relative;
  }

  .navy-strip{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    width:var(--strip-w);
    background:var(--navy);
    box-shadow:-10px 0 18px -6px rgba(20,25,40,0.35);
    z-index:5;
  }

  .card{
    width:100%;
    max-width:700px;
    background:#ffffff;
    border-radius:20px;
    box-shadow:0 25px 60px -10px rgba(20,25,40,0.28), 0 8px 20px -8px rgba(20,25,40,0.15);
    padding:44px 56px 48px;
    position:relative;
  }

  .card-header{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:10px;
  }

  .logo{
    flex:0 0 auto;
    width:66px;
    height:66px;
    color:var(--navy);
  }
  .logo img{ width:100%; height:100%; display:block; object-fit:contain; }

  .brand-text{ text-align:center; }
  .brand-text h1{
    margin:0 0 6px;
    font-size:clamp(19px, 2.6vw, 25px);
    font-weight:800;
    color:var(--navy);
    line-height:1.4;
  }
  .brand-text p{
    margin:0;
    font-size:14px;
    font-weight:500;
    color:var(--navy);
    opacity:0.75;
  }

  hr.top-rule{
    border:none;
    border-top:1px solid var(--line-light);
    margin:22px 0 26px;
  }

  h2.page-title{
    margin:0 0 26px;
    font-size:clamp(20px, 2.8vw, 26px);
    font-weight:700;
    color:var(--heading);
    text-align:center;
  }

  h3.section-title{
    margin:0 0 12px;
    font-size:16px;
    font-weight:700;
    color:var(--label);
    text-align:center;
  }

  p.desc{
    margin:0 auto 30px;
    font-size:14px;
    line-height:2;
    color:var(--body-gray);
    max-width:520px;
    text-align:center;
  }

  .field{
    position:relative;
    margin-bottom:14px;
  }
  .field .field-icon{
    position:absolute;
    right:0;
    top:0;
    height:calc(100% - 11px);
    display:flex;
    align-items:center;
    color:var(--placeholder);
    pointer-events:none;
    transition:color .15s;
  }
  .field .field-icon svg{
    width:18px;
    height:18px;
  }
  .field.filled .field-icon{ color:var(--label); }

  .field input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:15px;
    color:var(--heading);
    padding:0 26px 10px 0;
    border-bottom:1px solid var(--line);
    text-align:right;
    direction:rtl;
  }
  .field input::placeholder{ color:var(--placeholder); opacity:1; }
  .field input:focus{ border-bottom-color:var(--navy); }

  .row2{
    display:flex;
    flex-direction:row;
    align-items:flex-end;
    gap:14px;
    margin-bottom:14px;
  }
  .row2 .field{
    flex:1 1 auto;
    min-width:0;
    margin-bottom:0;
  }
  .captcha-box{
    flex:0 0 auto;
    width:155px;
    height:54px;
    min-width:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .captcha-box img{
    flex:1 1 auto;
    min-width:0;
    max-width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .captcha-divider{
    flex:0 0 auto;
    width:1px;
    height:60%;
    background:var(--line-light);
  }
  .captcha-box .captcha-refresh{
    flex:0 0 auto;
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    background:none;
    cursor:pointer;
    color:var(--navy);
    padding:0;
  }
  .captcha-box .captcha-refresh svg{
    width:18px;
    height:18px;
  }
  .captcha-box .captcha-refresh:hover{ background:rgba(48,74,121,0.06); }

  .error-msg{
    min-height:18px;
    font-size:13px;
    color:var(--error);
    margin:2px 0 8px;
  }

  button.submit{
    width:100%;
    margin-top:18px;
    padding:16px;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    background:var(--btn-idle-bg);
    color:var(--btn-idle-text);
    transition:background .2s, color .2s, transform .05s;
  }
  button.submit.active{
    background:var(--navy);
    color:#fff;
    cursor:pointer;
  }
  button.submit.active:hover{ background:var(--navy-dark); }
  button.submit.active:active{ transform:translateY(1px); }
  button.submit:disabled{ cursor:not-allowed; }

  #page3View{
    text-align:center;
    padding:30px 0 10px;
  }
  #page3View .check-circle{
    width:64px;height:64px;margin:0 auto 20px;
    border-radius:50%;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
  }
  #page3View .check-circle svg{ width:30px;height:30px; }
  #page3View h3{ margin:0 0 10px; color:var(--heading); font-size:19px; }
  #page3View p{ margin:0; color:var(--body-gray); font-size:14px; line-height:1.9; }

  [hidden]{ display:none !important; }

  @media (max-width:640px){
    :root{ --strip-w:20px; }
    body{ padding:18px calc(var(--strip-w) + 16px) 18px 18px; align-items:flex-start; }
    .card{ padding:28px 22px 32px; border-radius:16px; }
    .card-header{ gap:12px; }
    .logo{ width:50px; height:50px; }
    .brand-text h1{ font-size:17px; }
    .brand-text p{ font-size:12px; }
    h2.page-title{ font-size:19px; margin-bottom:20px; }
    p.desc{ font-size:13px; line-height:1.9; }
    .row2{
      gap:8px;
    }
    .captcha-box{ width:122px; height:48px; gap:6px; }
    .captcha-box .captcha-refresh{ width:24px; height:24px; }
    .captcha-box .captcha-refresh svg{ width:16px; height:16px; }
    .field .field-icon svg{ width:16px; height:16px; }
    .field input{ font-size:14px; padding-right:22px; }
    .navy-strip{ box-shadow:-10px 0 18px -6px rgba(20,25,40,0.55); }
  }
</style>
</head>
<body>

  <div class="navy-strip"></div>

  <div class="card">
    <div class="card-header">
      <div class="logo">
        <img src="assets/logo.png" alt="لوگوی سایت هنری من">
      </div>
      <div class="brand-text">
        <h1>درگاه یکپارچه احراز هویت</h1>
        <p>پنجره ملی خدمات دولت هوشمند</p>
      </div>
    </div>

    <hr class="top-rule">

    <h2 class="page-title">درگاه یکپارچه دسترسی به خدمات دولت</h2>

    <div id="loginView">
      <h3 class="section-title">ورود با کد ملی</h3>
      <p class="desc">جهت ورود به سامانه و دسترسی به خدمات، کد ملی خود را به همراه کد امنیتی وارد بفرمایید.</p>

      <form id="loginForm" novalidate>
        <div class="field" id="phoneField">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2.5" width="10" height="19" rx="2"/><line x1="10.5" y1="18" x2="13.5" y2="18"/></svg>
          </span>
          <input type="tel" id="phoneInput" inputmode="numeric" autocomplete="off" placeholder="کد ملی">
        </div>

        <div class="row2">
          <div class="field" id="captchaField">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 12.5l3 3 7-7"/></svg>
            </span>
            <input type="text" id="captchaInput" autocomplete="off" placeholder="کد امنیتی">
          </div>
          <div class="captcha-box">
            <img id="captchaImg" alt="کد امنیتی">
            <span class="captcha-divider"></span>
            <button type="button" class="captcha-refresh" id="refreshCaptcha" aria-label="تغییر کد امنیتی" title="تغییر کد امنیتی">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button type="submit" class="submit" id="submitBtn" disabled>ورود</button>
      </form>
    </div>

    <div id="page3View" hidden>
      <div class="check-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 12.5l5 5L20 7"/></svg>
      </div>
      <h3>ورود با موفقیت انجام شد</h3>
      <p>در حال انتقال به صفحه اصلی...<br></p>
    </div>
  </div>

<script>

  const CAPTCHAS = [
    { src: "assets/captcha1.png", answer: "38684" },
    { src: "assets/captcha2.png", answer: "57286" },
    { src: "assets/captcha3.png", answer: "15219" },
  ];

  let currentCaptcha = null;

  function toEnglishDigits(str){
    const fa = "۰۱۲۳۴۵۶۷۸۹", ar = "٠١٢٣٤٥٦٧٨٩";
    return str.replace(/[۰-۹٠-٩]/g, d => {
      let i = fa.indexOf(d);
      if(i === -1) i = ar.indexOf(d);
      return i === -1 ? d : i;
    });
  }

  function toPersianDigitsLive(str){
    const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    return str.replace(/[0-9]/g, d => fa[d]).replace(/[٠-٩]/g, d => {
      const ar = "٠١٢٣٤٥٦٧٨٩";
      return fa[ar.indexOf(d)];
    });
  }

  const VALID_NATIONAL_CODE = "0441622321";

  function loadRandomCaptcha(){
    currentCaptcha = CAPTCHAS[Math.floor(Math.random() * CAPTCHAS.length)];
    document.getElementById('captchaImg').src = currentCaptcha.src;
    document.getElementById('captchaInput').value = '';
    updateFieldState(document.getElementById('captchaField'));
    validateForm();
  }

  function updateFieldState(fieldEl){
    const input = fieldEl.querySelector('input');
    fieldEl.classList.toggle('filled', input.value.trim().length > 0);
  }

  function validateForm(){
    const phone = document.getElementById('phoneInput').value.trim();
    const code = document.getElementById('captchaInput').value.trim();
    const btn = document.getElementById('submitBtn');
    const ok = phone.length >= 3 && code.length > 0;
    btn.disabled = !ok;
    btn.classList.toggle('active', ok);
  }

  document.getElementById('phoneInput').addEventListener('input', e => {
    const cursorFromEnd = e.target.value.length - e.target.selectionStart;
    e.target.value = toPersianDigitsLive(e.target.value);
    const pos = e.target.value.length - cursorFromEnd;
    e.target.setSelectionRange(pos, pos);
    updateFieldState(document.getElementById('phoneField'));
    validateForm();
  });
  document.getElementById('captchaInput').addEventListener('input', e => {
    const cursorFromEnd = e.target.value.length - e.target.selectionStart;
    e.target.value = toPersianDigitsLive(e.target.value);
    const pos = e.target.value.length - cursorFromEnd;
    e.target.setSelectionRange(pos, pos);
    updateFieldState(document.getElementById('captchaField'));
    validateForm();
  });
  document.getElementById('refreshCaptcha').addEventListener('click', loadRandomCaptcha);

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const errorEl = document.getElementById('errorMsg');
    const phone = toEnglishDigits(document.getElementById('phoneInput').value.trim());
    const code = toEnglishDigits(document.getElementById('captchaInput').value.trim());

    if(phone.length < 7){
      errorEl.textContent = 'کد ملی وارد شده نادرست است';
      return;
    }
    if(code !== currentCaptcha.answer){
      errorEl.textContent = 'کد امنیتی وارد شده نادرست است';
      loadRandomCaptcha();
      return;
    }
    if(phone !== VALID_NATIONAL_CODE){
      errorEl.textContent = 'کد ملی وارد شده نادرست است';
      return;
    }

    errorEl.textContent = '';
    document.getElementById('loginView').hidden = true;
    document.getElementById('page3View').hidden = false;

    setTimeout(function(){
      window.location.href = "home.html";
    }, 700);
  });

  loadRandomCaptcha();
</script>
</body>
</html>
